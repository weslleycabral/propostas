<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>OG · Proposta MS Massage Therapies</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f6f5; --surface:#ffffff; --ink:#18272b; --muted:#5a6b6f; --line:#d9e1df;
  --accent:#0d6b6b; --accent-soft:#dcefed;
  --good:#1f7a4a; --bad:#a23a3a;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
}
*{box-sizing:border-box;margin:0}
html,body{width:1200px;height:630px;overflow:hidden;background:var(--bg)}
body{font-family:var(--f-body);color:var(--ink);position:relative}
.card{
  position:absolute;inset:0;
  padding:60px 72px 56px;
  display:grid;grid-template-rows:auto 1fr auto;
}
.card::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:14px;background:var(--accent);
}
.eyebrow{
  font:500 20px/1 var(--f-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--accent);
}
h1{
  font-family:var(--f-display);font-weight:700;font-size:72px;line-height:1.06;letter-spacing:-.025em;
  margin-top:22px;max-width:980px;color:var(--ink);
}
h1 em{font-style:normal;color:var(--accent)}
.stats{display:flex;gap:18px;align-self:end;margin-top:28px}
.stat{
  background:var(--surface);border:1px solid var(--line);border-radius:14px;
  padding:18px 24px 20px;display:grid;gap:6px;flex:1;
}
.stat b{font:700 46px/1.05 var(--f-display);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.stat b small{font-size:30px;vertical-align:middle}
.stat.good b{color:var(--good)} .stat.bad b{color:var(--bad)}
.stat span{font-size:21px;line-height:1.3;color:var(--muted)}
.foot{
  display:flex;justify-content:space-between;align-items:baseline;
  margin-top:34px;padding-top:22px;border-top:1px solid var(--line);
}
.client{font:600 24px/1.2 var(--f-body);color:var(--ink)}
.client small{font-weight:400;color:var(--muted);font-size:24px}
.sig{font:400 20px/1.2 var(--f-mono);color:var(--muted)}
</style>
</head>
<body>
<div class="card">
  <div>
    <div class="eyebrow">Diagnóstico e proposta</div>
    <h1>Visibilidade no <em>Google</em> e nas <em>IAs</em> para a MS Massage Therapies</h1>
  </div>
  <div class="stats">
    <div class="stat good"><b>5,0 <small>★</small></b><span>113 avaliações no Google, nota máxima</span></div>
    <div class="stat bad"><b>0 de 44</b><span>resultados de "massage" no Google Maps, buscando da sua porta</span></div>
  </div>
  <div class="foot">
    <div class="client">MS Massage Therapies <small>· Liverpool</small></div>
    <div class="sig">Weslley Cabral</div>
  </div>
</div>
</body>
</html>
